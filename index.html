<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroPredict - NMDGV12 Trà Vinh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-modal" style="display: flex;" class="fixed inset-0 z-50 items-center justify-center bg-slate-950/95">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl text-center">
            <div class="inline-flex p-3 bg-teal-500/10 text-teal-400 rounded-xl mb-3 text-2xl">
                <i class="fa-solid fa-wind"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">NMDGV12 Trà Vinh O&M</h2>
            <p class="text-slate-400 text-sm mb-6">Hệ thống Quản lý Vận hành & Giám sát AI</p>
            
            <button onclick="forceOpenApp()" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center">
                <i class="fa-solid fa-bolt mr-2"></i> Bấm vào đây để Vào Hệ Thống Ngay
            </button>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="app-container" style="display: none;" class="flex-1 flex flex-col">
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-teal-500 flex items-center justify-center text-slate-950 font-bold text-xl">
                    <i class="fa-solid fa-wind"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">AeroPredict AI <span class="text-xs px-2 py-0.5 bg-teal-500/20 text-teal-400 rounded-full">NMDGV12 Trà Vinh (36 MW)</span></h1>
                    <p class="text-xs text-slate-400">Đã đăng nhập thành công với tài khoản: nmdgv12travinh</p>
                </div>
            </div>
            <button onclick="location.reload()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg">Đăng xuất</button>
        </header>

        <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div class="text-slate-400 text-xs uppercase">Tổng công suất</div>
                    <div class="text-2xl font-bold text-white mt-1">36.0 MW</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div class="text-slate-400 text-xs uppercase">Số lượng tuabin</div>
                    <div class="text-2xl font-bold text-teal-400 mt-1">12 Trụ (WT-01 đến WT-12)</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div class="text-slate-400 text-xs uppercase">Trạng thái vận hành</div>
                    <div class="text-2xl font-bold text-emerald-400 mt-1">Ổn định (90%)</div>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                <h2 class="text-base font-bold text-white mb-4">Trạng thái 12 Tuabin Nhà máy</h2>
                <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3" id="turbine-grid"></div>
            </div>
        </main>
    </div>

    <script>
        function forceOpenApp() {
            // Ẩn màn hình khóa và hiện app trực tiếp bằng style
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            
            // Khởi tạo lưới tuabin
            const grid = document.getElementById('turbine-grid');
            grid.innerHTML = '';
            for(let i=1; i<=12; i++) {
                const id = `WT-${i < 10 ? '0'+i : i}`;
                const isWarn = (id === 'WT-04' || id === 'WT-09');
                grid.innerHTML += `
                    <div class="p-4 rounded-xl border ${isWarn ? 'border-amber-500/50 bg-amber-500/10 text-amber-300' : 'border-slate-800 bg-slate-950 text-slate-300'}">
                        <div class="font-bold text-sm text-white mb-1">${id}</div>
                        <div class="text-xs">Công suất: ${isWarn ? '2.1 MW' : '2.9 MW'}</div>
                        <div class="text-[10px] mt-1 ${isWarn ? 'text-amber-400 font-bold' : 'text-emerald-400'}">${isWarn ? 'Cần kiểm tra' : 'Hoạt động tốt'}</div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
